version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: authdemo
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: authdemo_db
    ports:
      - "5432:5432"
    volumes:
      - authdemo_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authdemo -d authdemo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_container
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petproject_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/authdemo_db
      - SPRING_DATASOURCE_USERNAME=authdemo
      - SPRING_DATASOURCE_PASSWORD=secretpassword
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petproject_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  authdemo_volume: