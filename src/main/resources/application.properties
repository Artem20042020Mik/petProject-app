spring.application.name=auth_clean

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authdemo_db}
spring.datasource.username=${DB_USER:authdemo}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.jwt.secret=${JWT_SECRET:LocalDevelopmentSecretKeyChangeMe12345!}
app.jwt.accessTokenTtlMinutes=15
app.jwt.refreshTokenTtlDays=7

app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.sameSite=${COOKIE_SAMESITE:Strict}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}