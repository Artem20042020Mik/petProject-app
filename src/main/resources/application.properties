spring.application.name=auth_clean

spring.datasource.url=jdbc:postgresql://localhost:5432/authdemo_db
spring.datasource.username=authdemo
spring.datasource.password=secretpassword
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.secret= LocalDevelopmentSecretKeyChangeMe12345!
app.jwt.accessTokenTtlMinutes=15
app.jwt.refreshTokenTtlDays=7

app.cookie.secure = false